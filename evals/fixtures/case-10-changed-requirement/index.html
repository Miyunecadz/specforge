<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Room booking</title><style>body{font-family:sans-serif;margin:2rem}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:.3rem .6rem}</style></head>
<body>
<main>
<h1>Book a meeting room</h1>
<form><label>Room <select><option>Oak</option><option>Elm</option></select></label>

<h2>My bookings</h2><table><tr><td>Oak, 5 Mar 10:00, 2 hours</td><td><button type="button">Cancel booking</button></td></tr></table>
</main>
</body></html>
