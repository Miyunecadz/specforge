[project]
name = "feature-research-agent"
version = "0.1.0"
description = "Claude Code workflow that turns a mockup and customer requirements into a traceable feature specification."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "jsonschema>=4.23,<5",
    "playwright>=1.49,<2",
    "pyyaml>=6.0,<7",
    "trafilatura>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
